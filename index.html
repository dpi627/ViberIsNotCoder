<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StorySlider</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;500;700&display=swap');
      
      body {
        font-family: 'Inter', 'Noto Sans TC', sans-serif;
        overflow: hidden; /* Prevent scroll on presentation */
      }

      /* ==========================================
         CHARACTER ANIMATIONS
         ========================================== */
      
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      
      @keyframes run {
        0% { transform: translateY(0) rotate(0deg); }
        25% { transform: translateY(-5px) rotate(2deg); }
        50% { transform: translateY(0) rotate(0deg); }
        75% { transform: translateY(-5px) rotate(-2deg); }
        100% { transform: translateY(0) rotate(0deg); }
      }

      @keyframes char-bounce {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-20px) scale(1.05); }
      }

      @keyframes char-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes char-shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
        20%, 40%, 60%, 80% { transform: translateX(5px); }
      }

      @keyframes char-jump {
        0%, 100% { transform: translateY(0) scaleY(1); }
        30% { transform: translateY(-30px) scaleY(1.1); }
        50% { transform: translateY(-35px) scaleY(1); }
        70% { transform: translateY(-30px) scaleY(1.1); }
      }

      @keyframes char-wave {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(15deg); }
        75% { transform: rotate(-15deg); }
      }

      @keyframes char-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.8; }
      }

      .animate-float { animation: float 3s ease-in-out infinite; }
      .animate-run { animation: run 0.4s infinite linear; }
      .animate-char-bounce { animation: char-bounce 0.6s ease-out; }
      .animate-char-spin { animation: char-spin 0.8s ease-in-out; }
      .animate-char-shake { animation: char-shake 0.5s ease-in-out; }
      .animate-char-jump { animation: char-jump 0.8s ease-out; }
      .animate-char-wave { animation: char-wave 0.5s ease-in-out 3; }
      .animate-char-pulse { animation: char-pulse 0.6s ease-in-out 2; }

      /* ==========================================
         SLIDE ENTER ANIMATIONS
         ========================================== */

      @keyframes slide-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes slide-left-in {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }

      @keyframes slide-right-in {
        from { transform: translateX(-100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }

      @keyframes slide-up-in {
        from { transform: translateY(100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      @keyframes slide-down-in {
        from { transform: translateY(-100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      @keyframes slide-zoom-in {
        from { transform: scale(0.5); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }

      @keyframes slide-zoom-out-in {
        from { transform: scale(1.5); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }

      @keyframes slide-flip-in {
        from { transform: perspective(1000px) rotateY(-90deg); opacity: 0; }
        to { transform: perspective(1000px) rotateY(0deg); opacity: 1; }
      }

      @keyframes slide-bounce-in {
        0% { transform: scale(0.3); opacity: 0; }
        50% { transform: scale(1.1); }
        70% { transform: scale(0.9); }
        100% { transform: scale(1); opacity: 1; }
      }

      .animate-slide-fade { animation: slide-fade-in 0.5s ease-out forwards; }
      .animate-slide-left { animation: slide-left-in 0.6s ease-out forwards; }
      .animate-slide-right { animation: slide-right-in 0.6s ease-out forwards; }
      .animate-slide-up { animation: slide-up-in 0.6s ease-out forwards; }
      .animate-slide-down { animation: slide-down-in 0.6s ease-out forwards; }
      .animate-slide-zoom-in { animation: slide-zoom-in 0.5s ease-out forwards; }
      .animate-slide-zoom-out { animation: slide-zoom-out-in 0.5s ease-out forwards; }
      .animate-slide-flip { animation: slide-flip-in 0.6s ease-out forwards; }
      .animate-slide-bounce { animation: slide-bounce-in 0.7s ease-out forwards; }

      /* ==========================================
         SLIDE EXIT ANIMATIONS
         ========================================== */

      @keyframes slide-fade-out {
        from { opacity: 1; }
        to { opacity: 0; }
      }

      @keyframes slide-left-out {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(-100%); opacity: 0; }
      }

      @keyframes slide-right-out {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(100%); opacity: 0; }
      }

      .animate-slide-fade-out { animation: slide-fade-out 0.4s ease-in forwards; }
      .animate-slide-left-out { animation: slide-left-out 0.5s ease-in forwards; }
      .animate-slide-right-out { animation: slide-right-out 0.5s ease-in forwards; }

      /* ==========================================
         DIALOGUE ANIMATIONS
         ========================================== */

      @keyframes dialogue-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes dialogue-slide-up {
        from { transform: translateY(30px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      @keyframes dialogue-pop {
        0% { transform: scale(0.5); opacity: 0; }
        70% { transform: scale(1.1); }
        100% { transform: scale(1); opacity: 1; }
      }

      .animate-dialogue-fade { animation: dialogue-fade-in 0.4s ease-out forwards; }
      .animate-dialogue-slide-up { animation: dialogue-slide-up 0.5s ease-out forwards; }
      .animate-dialogue-pop { animation: dialogue-pop 0.4s ease-out forwards; }
      
      .typewriter-cursor::after {
        content: '|';
        animation: blink 1s step-start infinite;
      }
      
      @keyframes blink {
        50% { opacity: 0; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",

  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-900 text-white antialiased selection:bg-pink-500 selection:text-white">

</body>
</html>
